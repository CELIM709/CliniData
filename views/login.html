<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - CliniData</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<a href="../index.html" aria-label="Volver a la página principal" title="Volver a la página principal" style="position: absolute; top: 20px; left: 20px; color: inherit; text-decoration: none; font-size: 28px; line-height: 1;">←</a>

<div style="position: absolute; top: 20px; right: 20px;">
    <button class="theme-toggle" onclick="document.body.classList.toggle('dark-mode')" aria-label="Cambiar modo claro/oscuro" title="Cambiar tema">🌓</button>
</div>

<div class="login-wrapper">
    <div class="login-card">
        <div class="login-logo-frame">
            <img src="../images/logoclinidata.png" alt="CliniData Logo">
        </div>
        <p>Proporcionando el mejor cuidado médico</p>
        
        <form id="form-login">
            <div class="form-group">
                <label for="login_cedula_numero">Cédula</label>
                <div style="display:flex; gap:8px;">
                    <select id="login_cedula_letra" class="form-control" style="max-width:80px;">
                        <option value="V">V</option>
                        <option value="E">E</option>
                    </select>
                    <input type="text" id="login_cedula_numero" class="form-control" required
                           inputmode="numeric" pattern="\d{7,8}" maxlength="8"
                           placeholder="Ej: 30437441" title="7 u 8 dígitos, sin letras ni guiones" autofocus>
                </div>
                <input type="hidden" id="cedula" name="cedula">
            </div>

            <div class="form-group">
                <label for="clave_acceso">Contraseña</label>
                <input type="password" id="clave_acceso" name="clave_acceso" class="form-control" required placeholder="Ingresa tu contraseña">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Acceder al Sistema</button>
        </form>
    </div>
</div>

<script>
    // 1. Función para armar la cédula
    function combinarCedula(idLetra, idNumero, idOculto) {
        const letra = document.getElementById(idLetra);
        const numero = document.getElementById(idNumero);
        const oculto = document.getElementById(idOculto);
        const actualizar = () => { oculto.value = numero.value ? `${letra.value}-${numero.value}` : ''; };
        letra.addEventListener('change', actualizar);
        numero.addEventListener('input', actualizar);
    }
    combinarCedula('login_cedula_letra', 'login_cedula_numero', 'cedula');

    // 2. Interceptar el formulario de Login
    const formLogin = document.querySelector('form');
    
    formLogin.addEventListener('submit', async (evento) => {
        evento.preventDefault(); 

        const payload = {
            identificador: document.getElementById('cedula').value,
            clave: document.getElementById('clave_acceso').value
        };

        try {
            // Ruta corregida: sale de 'views' (../) y entra a 'clinica-backend/api'
            const respuesta = await fetch('../clinica-backend/api/login.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            const datos = await respuesta.json();

            if (respuesta.ok && datos.success) {
                const rol = datos.usuario.rol;
                
                if (rol === 'RECEPCIONISTA') {
                    window.location.href = 'recepcionista_dashboard.html';
                } else if (rol === 'ADMIN') {
                    window.location.href = 'administrador_dashboard.html';
                } else if (rol === 'MEDICO') {
                    window.location.href = 'medico_dashboard.html';
                } else if (rol === 'LABORATORISTA') {
                    window.location.href = 'laboratorista_dashboard.html';
                } else {
                    alert('Rol sin vista asignada: ' + rol);
                }
            } else {
                alert('Credenciales inválidas: ' + datos.error);
            }
        } catch (error) {
            console.error("Error en la petición de login:", error);
            alert("No se pudo conectar con el servidor. Abre F12 para más detalles.");
        }
    }); 
</script>
</body>
</html>
